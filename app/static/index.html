<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeamBoard</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">T</span><span>TeamBoard</span></a><nav><a class="active" href="#workspace">◫ <span>My workspace</span></a><a href="#activity">◌ <span>Activity</span></a><button id="members-button" class="nav-button" type="button">◉ <span>Members</span></button></nav><button id="profile-button" class="sidebar-bottom" type="button"><div class="mini-avatar">VK</div><div><strong>Vishnu Kanchi</strong><span>Workspace owner</span></div></button></aside><div class="app-shell"><header><div><p class="eyebrow">PRODUCT LAUNCH / CURRENT SPRINT</p><h1>Keep momentum.</h1></div><div class="header-actions"><span id="connection" class="connection">Connecting…</span><button id="new-task" class="button">+ Add task</button></div></header>
<main id="workspace"><section class="summary" id="summary"></section><section class="content"><div class="board"><div class="section-title"><div><h2>Current sprint</h2><p>Move work forward, one clear outcome at a time.</p></div><label class="filter-label">Show<select id="filter-select" class="filter-button"><option value="all">All tasks</option><option value="high">High priority</option><option value="doing">In progress</option><option value="done">Completed</option></select></label></div><div id="columns" class="columns"></div></div><aside id="activity" class="activity"><p class="eyebrow">RECENT ACTIVITY</p><h2>Workspace pulse</h2><div id="activity-list"></div></aside></section></main></div>
<dialog id="task-dialog"><form id="task-form"><div class="dialog-title"><h2>New task</h2><button id="close-dialog" type="button" class="close">×</button></div><label>Title<input id="title" required maxlength="120" placeholder="What needs to happen?"></label><label>Description<textarea id="description" maxlength="500" placeholder="Add context for your team"></textarea></label><div class="split"><label>Priority<select id="priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></label><label>Assignee<select id="assignee"></select></label></div><label>Due date<input id="due-date" type="date"></label><button class="button" type="submit">Create task</button></form></dialog>
<dialog id="detail-dialog"><div id="task-detail"></div></dialog><dialog id="members-dialog"><div class="dialog-title"><div><p class="eyebrow">WORKSPACE PEOPLE</p><h2>Members</h2></div><button class="close" data-close="members-dialog" type="button">×</button></div><div id="members-list" class="members-list"></div><form id="member-form"><div class="member-form-title"><h3 id="member-form-heading">Add a member</h3><button id="cancel-member-edit" type="button" hidden>Cancel edit</button></div><label>Name<input id="member-name" required maxlength="80" placeholder="Avery Jones"></label><div class="split"><label>Initials<input id="member-initials" required maxlength="3" placeholder="AJ"></label><label>Role<input id="member-role" required maxlength="60" placeholder="Engineering"></label></div><button id="member-submit" class="button" type="submit">Add member</button></form></dialog><dialog id="profile-dialog"><form id="profile-form"><div class="dialog-title"><div><p class="eyebrow">PERSONAL SETTINGS</p><h2>Your profile</h2></div><button class="close" data-close="profile-dialog" type="button">×</button></div><label>Name<input id="profile-name" required maxlength="80"></label><div class="split"><label>Initials<input id="profile-initials" required maxlength="3"></label><label>Role<input id="profile-role" required maxlength="60"></label></div><button class="button" type="submit">Save profile</button></form></dialog><script src="/static/app.js"></script></body></html>
